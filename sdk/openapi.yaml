openapi: 3.1.0
info:
  title: new-api OAuth 2.0 Provider API
  description: |
    OAuth 2.0 / OIDC provider endpoints for external applications integrating
    with new-api. External systems use the Authorization Code flow with PKCE
    to authenticate users and obtain access tokens for calling AI APIs.
  version: 1.0.0
servers:
  - url: https://ai.example.com
    description: new-api instance

paths:
  /oauth/authorize:
    get:
      summary: Authorization endpoint
      description: |
        Initiates the OAuth 2.0 authorization code flow. Redirects the user to
        log in (if needed) and grant consent, then redirects back to the
        redirect_uri with an authorization code.
      parameters:
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: client_id
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          required: true
          schema: { type: string }
          description: "Space-separated scopes: openid profile email api:read api:write"
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: nonce
          in: query
          required: false
          schema: { type: string }
          description: OIDC nonce, echoed into the ID token.
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
        - name: code_challenge_method
          in: query
          required: false
          schema: { type: string, enum: [S256], default: S256 }
      responses:
        "302":
          description: Redirect to redirect_uri with code or error
        "400":
          description: Invalid request parameters

  /oauth/token:
    post:
      summary: Token endpoint
      description: |
        Exchanges an authorization code or refresh token for tokens. Client
        authentication uses HTTP Basic (`client_secret_basic`) or the
        `client_id` / `client_secret` form fields (`client_secret_post`).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - type: object
                  properties:
                    grant_type: { type: string, enum: [authorization_code] }
                    code: { type: string }
                    redirect_uri: { type: string }
                    code_verifier: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                  required: [grant_type, code, redirect_uri, code_verifier]
                - type: object
                  properties:
                    grant_type: { type: string, enum: [refresh_token] }
                    refresh_token: { type: string }
                    client_id: { type: string }
                    client_secret: { type: string }
                  required: [grant_type, refresh_token]
      security:
        - basicAuth: []
      responses:
        "200":
          description: Token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  id_token:
                    type: string
                    description: Only returned when the granted scope includes `openid`.
                  scope: { type: string }
                required: [access_token, token_type, expires_in, refresh_token, scope]
        "400":
          description: OAuth error (invalid_grant, invalid_request, etc.)
        "401":
          description: Client authentication failed (invalid_client)

  /oauth/userinfo:
    get:
      summary: UserInfo endpoint
      description: Returns user claims based on the granted scopes.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string }
                  username: { type: string }
                  name: { type: string }
                  email: { type: string }
        "401":
          description: Invalid or expired token

  /oauth/introspect:
    post:
      summary: Token introspection (RFC 7662)
      description: |
        Validates an access or refresh token and returns its metadata. Client
        authentication uses HTTP Basic or the `client_id` / `client_secret`
        form fields.
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
                client_id: { type: string }
                client_secret: { type: string }
              required: [token]
      responses:
        "200":
          description: Introspection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  scope: { type: string }
                  client_id: { type: string }
                  username: { type: string }
                  sub: { type: string }
                  token_type: { type: string }
                  exp: { type: integer }
                  iat: { type: integer }
                required: [active]
        "401":
          description: Client authentication failed (invalid_client)

  /oauth/revoke:
    post:
      summary: Token revocation (RFC 7009)
      description: |
        Revokes a refresh token. Client authentication uses HTTP Basic or the
        `client_id` / `client_secret` form fields.
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
              required: [token]
      responses:
        "200":
          description: Token revoked (always 200 per RFC 7009)
        "401":
          description: Client authentication failed (invalid_client)

  /oauth/logout:
    get:
      summary: End session endpoint
      description: Revokes the user's refresh tokens for the app and optionally redirects.
      parameters:
        - name: id_token_hint
          in: query
          schema: { type: string }
        - name: post_logout_redirect_uri
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to post_logout_redirect_uri
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
    post:
      summary: End session endpoint (form post)
      description: Same as GET; accepts `id_token_hint` and `post_logout_redirect_uri` as form fields.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token_hint: { type: string }
                post_logout_redirect_uri: { type: string }
                state: { type: string }
      responses:
        "302":
          description: Redirect to post_logout_redirect_uri
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /oauth/jwks:
    get:
      summary: JSON Web Key Set
      description: Returns the RSA public key used to sign access tokens and ID tokens.
      responses:
        "200":
          description: JWKS document
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "500":
          description: Signing key unavailable

  /.well-known/openid-configuration:
    get:
      summary: OIDC discovery document
      responses:
        "200":
          description: Provider metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string }
                  authorization_endpoint: { type: string }
                  token_endpoint: { type: string }
                  userinfo_endpoint: { type: string }
                  jwks_uri: { type: string }
                  end_session_endpoint: { type: string }
                  introspection_endpoint: { type: string }
                  revocation_endpoint: { type: string }
                  scopes_supported: { type: array, items: { type: string } }
                  response_types_supported: { type: array, items: { type: string } }
                  response_modes_supported: { type: array, items: { type: string } }
                  grant_types_supported: { type: array, items: { type: string } }
                  subject_types_supported: { type: array, items: { type: string } }
                  id_token_signing_alg_values_supported: { type: array, items: { type: string } }
                  token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
                  code_challenge_methods_supported: { type: array, items: { type: string } }
                  claims_supported: { type: array, items: { type: string } }

  /api/app-proxy/users:
    post:
      summary: Provision an independent proxy user (admin user:write)
      description: Trusted backend verifies the native identity first. The App issuer must match exactly. Retries return the same immutable App user; disabled accounts are never reactivated.
      security: [{ adminPAT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, issuer, subject]
              properties:
                app_id: {type: integer, minimum: 1}
                issuer: {type: string, format: uri}
                subject: {type: string}
      responses:
        "200": {description: Success envelope with data.user_id, app_id, identity_source=proxy and status; no credentials}
        "403": {description: Insufficient role/scope or invalid App ownership}
        "409": {description: Conflicting immutable identity}
  /api/app-proxy/users/{user_id}/wallet:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
    get:
      summary: Read specified-user wallet (admin user:read)
      security: [{adminPAT: []}]
      responses:
        "200":
          description: Normalized wallet in data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/AppWallet'}
        "403": {description: Wrong user/App/source or insufficient authority}
  /api/app-proxy/users/{user_id}/keys:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
    get:
      summary: List masked App keys (admin api_key:read)
      security: [{adminPAT: []}]
      parameters:
        - {name: status, in: query, schema: {type: integer}}
        - {name: p, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {description: Success envelope data.items and data.total; key is always masked}
    post:
      summary: Create or stage a recoverable key (admin api_key:write)
      description: Key ownership is immutable. old_token_id stages rotation, preserving the old key. Limited-key rotation is rejected until shared budget continuity is available. The returned secret is server-only; save and verify before committing rotation.
      security: [{adminPAT: []}]
      parameters:
        - {$ref: '#/components/parameters/OperationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 100}
                expired_time: {type: integer, description: '-1 means no expiry'}
                remain_quota: {type: integer, minimum: 0}
                unlimited_quota: {type: boolean}
                model_limits_enabled: {type: boolean}
                model_limits: {type: string}
                allow_ips: {type: string}
                group: {type: string}
                old_token_id: {type: integer, minimum: 1}
                quota_rule_id: {type: integer, minimum: 0, description: Atomic binding to a rule owned by this proxy user}
      responses:
        "200": {description: Success envelope with issued key; Cache-Control no-store}
        "409": {description: Operation conflict or limited rotation unsupported}
  /api/app-proxy/users/{user_id}/keys/{token_id}:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
      - {name: token_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    put:
      summary: Update name, remaining quota or enabled status (admin api_key:write)
      security: [{adminPAT: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: integer, enum: [1,2]}
                name: {type: string, maxLength: 100}
                remain_quota: {type: integer, minimum: 0}
      responses:
        "200": {description: Success envelope}
  /api/app-proxy/users/{user_id}/keys/{token_id}/commit-rotation:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
      - {name: token_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      summary: Commit a saved and verified replacement (admin api_key:write)
      security: [{adminPAT: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacement_key]
              properties:
                replacement_key: {type: string, writeOnly: true}
      responses:
        "200": {description: Old key revoked; repeat commit is idempotent}
  /api/app-proxy/users/{user_id}/keys/{token_id}/cancel-rotation:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
      - {name: token_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      summary: Cancel pending replacement (admin api_key:write)
      description: Idempotently disables only the replacement; permits authorized cleanup after App disablement. Cancelled replacements cannot be committed, reissued with the original operation ID, or enabled again.
      security: [{adminPAT: []}]
      responses:
        "200": {description: Success envelope data.rotation_status=cancelled; no credentials}
        "409": {description: operation_conflict if already committed}
  /api/app-proxy/users/{user_id}/quota-rules:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
    get:
      summary: List specified-user rules (admin api_key:read)
      security: [{adminPAT: []}]
      parameters:
        - {name: p, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {description: 'Success envelope data.items, total, server_time; each rule includes validity_status (disabled/scheduled/effective/expired), nullable valid_from/valid_until and bound_token_count'}
    post:
      summary: Create specified-user rule (admin api_key:write)
      security: [{adminPAT: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppQuotaRuleInput'}
      responses:
        "200": {description: Success envelope with target-owned rule; creates no wallet funds or subscription}
  /api/app-proxy/users/{user_id}/quota-rules/{id}:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
      - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
    put:
      summary: Save specified-user rule (admin api_key:write)
      description: Omitted validity endpoints preserve existing values; explicit null clears. Editing never clears period usage. Unknown fields and ownership metadata are rejected.
      security: [{adminPAT: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppQuotaRuleInput'}
      responses:
        "200": {description: Success envelope with updated rule}
    delete:
      summary: Delete an unbound rule (admin api_key:write)
      security: [{adminPAT: []}]
      responses:
        "200": {description: Success envelope; original in-flight usage survives deletion}
  /api/app-proxy/users/{user_id}/keys/{token_id}/quota-rule:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
      - {name: token_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    put:
      summary: Bind a target-owned rule (admin api_key:write)
      description: Pending source rotations must first be committed or cancelled. rule_id=0 removes the restriction and is permitted for cleanup after App disablement.
      security: [{adminPAT: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rule_id]
              properties:
                rule_id: {type: integer, minimum: 0}
      responses:
        "200": {description: Success envelope}
        "409": {description: operation_conflict for pending rotation}
  /api/app-proxy/users/{user_id}/checkout:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
    post:
      summary: Open a specified-user cashier (admin billing:write)
      description: Proxy users support Waffo Pancake top-up and one-time products only; subscriptions are rejected even on a dual-mode App. The server freezes the financial snapshot before any provider effect. An uncertain result must reuse the same request ID or be reconciled; browser redirects never prove payment.
      security: [{adminPAT: []}]
      parameters:
        - {$ref: '#/components/parameters/OperationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, purchase_type, payment_method]
              properties:
                app_id: {type: integer, minimum: 1}
                purchase_type: {type: string, enum: [topup, product]}
                payment_method: {type: string, const: waffo_pancake}
                amount: {type: integer, minimum: 1}
                product_id: {type: integer, minimum: 1}
      responses:
        "200": {description: Stable order_id, status, frozen quota/credits and provider checkout link when available}
        "409": {description: Request ID reused with changed parameters}
  /api/app-proxy/users/{user_id}/orders/{order_id}:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
      - {name: order_id, in: path, required: true, schema: {type: string}}
    get:
      summary: Read the exact durable order (admin billing:read)
      security: [{adminPAT: []}]
      responses:
        "200": {description: Success envelope data with actual order state; historical reads remain available when the App is disabled}
        "404": {description: No order belonging to this user and App}
  /oauth/wallet:
    get:
      summary: Normalized token-owner App wallet (api:read)
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Success envelope with the normalized wallet in data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data: {$ref: '#/components/schemas/AppWallet'}
  /oauth/orders:
    get:
      summary: Token-owner orders for the fixed App (api:read)
      security: [{bearerAuth: []}]
      parameters:
        - {name: p, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {description: Success envelope data.items and total; historical orders without ratio snapshots return null credits}
  /oauth/orders/{order_id}:
    get:
      summary: Exact token-owner order status (api:read)
      security: [{bearerAuth: []}]
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Success envelope data with order_id, user_id, app_id and actual order status}
        "403": {description: Wrong scope, App disabled or OAuth disabled}
        "404": {description: No matching order in this user's App}

  /api/app-proxy/users/{user_id}/catalog:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
    get:
      summary: 'catalog (admin billing:read)'
      security: [{adminPAT: []}]
      responses:
        "200": {description: 'Raw App products, nullable credits, empty plans, subscription_supported false and configured payment_methods'}
  /api/app-proxy/users/{user_id}/pricing:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
    get:
      summary: 'pricing (admin user:read)'
      security: [{adminPAT: []}]
      responses:
        "200": {description: 'Raw App pricing catalog filtered to its whitelist; includes quota_per_credit'}
  /api/app-proxy/users/{user_id}/logs:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
    get:
      summary: 'logs (admin log:read)'
      security: [{adminPAT: []}]
      responses:
        "200": {description: 'Legacy redacted log-list shape scoped to the fixed user and App'}
  /api/app-proxy/users/{user_id}/orders:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
    get:
      summary: 'orders (admin billing:read)'
      security: [{adminPAT: []}]
      responses:
        "200": {description: 'Success envelope data.items, total, page, page_size; optional keyword and p filters'}
  /api/app-proxy/users/{user_id}/topup-preview:
    parameters:
      - {$ref: '#/components/parameters/ProxyUserId'}
      - {$ref: '#/components/parameters/AppId'}
    post:
      summary: Server-priced App top-up preview
      security: [{adminPAT: []}]
      description: Admin billing:read. Explicit app_id is required in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payment_method, app_id]
              properties:
                app_id: {type: integer, minimum: 1}
                amount: {type: integer, minimum: 1}
                payment_method: {type: string, const: waffo_pancake}
      responses:
        "200": {description: Success envelope data with money, currency, quota, credits and quota_per_credit}
  /oauth/topup/preview:
    post:
      summary: Server-priced App top-up preview
      security: [{bearerAuth: []}]
      description: OAuth api:read. User and App derive from the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payment_method]
              properties:
                app_id: {type: integer, minimum: 1}
                amount: {type: integer, minimum: 1}
                payment_method: {type: string, const: waffo_pancake}
      responses:
        "200": {description: Success envelope data with money, currency, quota, credits and quota_per_credit}

components:
  parameters:
    ProxyUserId: {name: user_id, in: path, required: true, schema: {type: integer, minimum: 1}}
    AppId: {name: app_id, in: query, required: true, schema: {type: integer, minimum: 1}}
    OperationId: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  schemas:
    AppQuotaRuleInput:
      type: object
      additionalProperties: false
      required: [name, enabled, quota_limit_enabled, quota_period, quota_limit, time_window_enabled, time_window_timezone, allowed_weekdays]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 255}
        enabled: {type: boolean, description: 'false bypasses the rule; it does not disable the key'}
        quota_limit_enabled: {type: boolean}
        quota_period: {type: string, enum: [daily, weekly, monthly]}
        quota_limit: {type: integer, minimum: 0, maximum: 9007199254740991}
        time_window_enabled: {type: boolean}
        time_window_timezone: {type: string, enum: [UTC, Asia/Shanghai]}
        allowed_weekdays: {type: string, description: 'JSON-encoded array of ISO weekday integers 1..7'}
        valid_from: {type: integer, format: int64, nullable: true, minimum: 1, maximum: 253402300799, description: 'Inclusive UTC Unix seconds; must precede valid_until'}
        valid_until: {type: integer, format: int64, nullable: true, minimum: 1, maximum: 253402300799, description: 'Exclusive UTC Unix seconds; expired requests fail 403 rule_expired'}
    AppWallet:
      type: object
      required: [user_id, app_id, identity_source, quota, used_quota, quota_per_credit, credits, used_credits, capabilities]
      properties:
        user_id: {type: integer}
        app_id: {type: integer}
        identity_source: {type: string, enum: [proxy, platform]}
        quota: {type: integer, description: 'Remaining quota; may be negative debt. Never subtract used_quota again.'}
        used_quota: {type: integer}
        quota_per_credit: {type: [integer, 'null'], minimum: 1, maximum: 9007199254740991}
        credits: {type: [string, 'null'], description: 'Exact decimal, truncated toward zero to at most six fraction digits. Check negative raw quota for tiny debt.'}
        used_credits: {type: [string, 'null']}
        request_count: {type: [integer, 'null']}
        statistics_window: {type: [string, 'null']}
        capabilities:
          type: object
          required: [subscription_supported]
          properties:
            subscription_supported: {type: boolean, description: 'Always false for a proxy user'}
  securitySchemes:
    adminPAT:
      type: http
      scheme: bearer
      bearerFormat: Personal access token
      description: 'Server-only admin nap_ token with the operation scope. app_id does not restrict its administrative authority.'
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
