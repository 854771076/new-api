openapi: 3.1.0
info:
  title: new-api OAuth 2.0 Provider API
  description: |
    OAuth 2.0 / OIDC provider endpoints for external applications integrating
    with new-api. External systems use the Authorization Code flow with PKCE
    to authenticate users and obtain access tokens for calling AI APIs.
  version: 1.0.0
servers:
  - url: https://ai.example.com
    description: new-api instance

paths:
  /oauth/authorize:
    get:
      summary: Authorization endpoint
      description: |
        Initiates the OAuth 2.0 authorization code flow. Redirects the user to
        log in (if needed) and grant consent, then redirects back to the
        redirect_uri with an authorization code.
      parameters:
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: client_id
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          required: true
          schema: { type: string }
          description: Space-separated scopes: openid profile email api:read api:write
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
        - name: code_challenge_method
          in: query
          required: false
          schema: { type: string, enum: [S256], default: S256 }
      responses:
        "302":
          description: Redirect to redirect_uri with code or error
        "400":
          description: Invalid request parameters

  /oauth/token:
    post:
      summary: Token endpoint
      description: Exchanges an authorization code or refresh token for tokens.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - type: object
                  properties:
                    grant_type: { type: string, enum: [authorization_code] }
                    code: { type: string }
                    redirect_uri: { type: string }
                    code_verifier: { type: string }
                  required: [grant_type, code, redirect_uri, code_verifier]
                - type: object
                  properties:
                    grant_type: { type: string, enum: [refresh_token] }
                    refresh_token: { type: string }
                  required: [grant_type, refresh_token]
      security:
        - basicAuth: []
      responses:
        "200":
          description: Token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  id_token: { type: string }
                  scope: { type: string }
        "400":
          description: OAuth error (invalid_grant, invalid_request, etc.)

  /oauth/userinfo:
    get:
      summary: UserInfo endpoint
      description: Returns user claims based on the granted scopes.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string }
                  username: { type: string }
                  name: { type: string }
                  email: { type: string }
        "401":
          description: Invalid or expired token

  /oauth/introspect:
    post:
      summary: Token introspection (RFC 7662)
      description: Validates an access or refresh token and returns its metadata.
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
              required: [token]
      responses:
        "200":
          description: Introspection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  scope: { type: string }
                  client_id: { type: string }
                  username: { type: string }
                  sub: { type: string }
                  token_type: { type: string }
                  exp: { type: integer }
                  iat: { type: integer }

  /oauth/revoke:
    post:
      summary: Token revocation (RFC 7009)
      description: Revokes a refresh token.
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "200":
          description: Token revoked (always 200 per RFC 7009)

  /oauth/logout:
    get:
      summary: End session endpoint
      description: Revokes the user's refresh tokens for the app and optionally redirects.
      parameters:
        - name: id_token_hint
          in: query
          schema: { type: string }
        - name: post_logout_redirect_uri
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to post_logout_redirect_uri
        "200":
          description: Logout successful

  /.well-known/openid-configuration:
    get:
      summary: OIDC discovery document
      responses:
        "200":
          description: Provider metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string }
                  authorization_endpoint: { type: string }
                  token_endpoint: { type: string }
                  userinfo_endpoint: { type: string }
                  jwks_uri: { type: string }
                  end_session_endpoint: { type: string }
                  introspection_endpoint: { type: string }
                  revocation_endpoint: { type: string }
                  scopes_supported: { type: array, items: { type: string } }
                  response_types_supported: { type: array, items: { type: string } }
                  grant_types_supported: { type: array, items: { type: string } }
                  code_challenge_methods_supported: { type: array, items: { type: string } }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
