# docker-compose.single.yml
#
# Standalone single-node Redis variant of the new-api stack. Used by
# scripts/start-single.ps1 to spin up the "before" baseline without the
# Sentinel overlay. Provides its own redis + new-api definitions so it does
# not inherit the Sentinel-mode environment from docker-compose.sentinel.yml.
#
# Usage:
#   docker compose -f docker-compose.single.yml up -d
# Stop:
#   docker compose -f docker-compose.single.yml down

services:
  redis:
    image: redis:latest
    container_name: redis-single
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ Change before production.
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres-single
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - pg_data_single:/var/lib/postgresql/data
    networks:
      - new-api-network

  new-api:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
    image: new-api:local-single
    container_name: new-api-single
    restart: always
    command: --log-dir /app/logs
    ports:
      - "30000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres-single:5432/new-api
      - REDIS_CONN_STRING=redis://:123456@redis-single:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-single-1
    depends_on:
      - postgres
      - redis
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_data_single:

networks:
  new-api-network:
    driver: bridge