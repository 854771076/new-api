# Sentinel-1 configuration for the new-api Redis Sentinel stack.
# Bind to all interfaces so replicas / app containers on the same network can reach it.
bind 0.0.0.0
port 26379

# Master address uses a STATIC IP rather than a container hostname. This is the
# critical fix for scenario 3: when the master container is SIGKILLed, Docker
# DNS returns errors for the hostname, which makes sentinel enter +tilt mode
# and refuse to run any failover for 30+ seconds. With a static IP the
# address itself never changes; if it stops responding sentinel treats that
# as a normal network failure and runs election without tilt interference.
sentinel monitor mymaster 172.28.0.10 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 60000
sentinel parallel-syncs mymaster 1

# Disable hostname resolution for the monitored master; sentinel must always
# see the literal IP we put in `sentinel monitor`. Without this, internal
# DNS lookups can still fire and trigger tilt.
sentinel resolve-hostnames no

# Announce this sentinel at a literal, network-stable address so other
# sentinels and clients always see sentinel-1 at the same place even after
# container restarts.
sentinel announce-ip 172.28.0.21
sentinel announce-port 26379

# ACL / password set in environment: REQUIREPASS via REDIS_SENTINEL_PASSWORD (no plain text here).
sentinel auth-pass mymaster 123456
sentinel deny-scripts-reconfig yes