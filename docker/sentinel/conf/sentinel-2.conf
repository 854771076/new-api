bind 0.0.0.0
port 26379

sentinel monitor mymaster 172.28.0.10 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 60000
sentinel parallel-syncs mymaster 1
sentinel resolve-hostnames no
sentinel announce-ip 172.28.0.22
sentinel announce-port 26379

sentinel deny-scripts-reconfig yes
# The master password is injected when the container starts (see
# docker-compose.sentinel.yml) and must not live in this file: the
# master runs with --requirepass $REDIS_PASSWORD, and a mismatch
# makes sentinel fail to authenticate, mark the master down and
# silently break failover.
